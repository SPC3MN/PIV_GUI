[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piv-suite"
version = "0.2.13"
description = "Unified planar/stereo, CPU/GPU PIV processing suite with a desktop GUI, built on OpenPIV"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "lvpyio",
    # io/readers.py imports these directly (TIFF/PNG/BMP/JPG loose-file
    # pair support) -- currently present anyway as transitive dependencies
    # of openpiv (openpiv -> imageio directly, openpiv -> scikit-image ->
    # tifffile), but that's incidental to THIS package's own dependency
    # graph, not guaranteed by it: a future openpiv release could drop
    # either one and silently break this documented, user-facing feature
    # with no signal here explaining why. Declaring them directly is the
    # correct fix regardless of what else happens to provide them today.
    "tifffile",
    "imageio",
    # engines/_openpiv_speedups.py monkeypatches several openpiv internals
    # with "faithful" reimplementations verified bit-exact against this
    # exact version's actual source (a routine 0.25.4->0.25.5 upgrade once
    # silently broke that guarantee -- see that module's and
    # tests/unit/test_openpiv_speedups.py's docstrings). Bump this pin and
    # the version tripwire test together, only after re-verifying the
    # whole suite against the new version.
    "openpiv>=0.25.5,<0.26",
]

[project.optional-dependencies]
gpu = [
    # Pick the cupy variant matching your CUDA toolkit; openpiv-python-gpu
    # is not on PyPI -- clone it and add to PYTHONPATH (see README).
    # "cupy-cuda11x", "cupy-cuda12x", "cupy-cuda13x",
]
gui = [
    "PySide6",
]
dev = [
    "pytest",
    "pytest-qt",
]

[project.scripts]
piv-suite = "piv_suite.cli.main:main"
piv-suite-gui = "piv_suite_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]
